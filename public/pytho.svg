<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="pythoGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4BDE80"/>
      <stop offset="50%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>
    <linearGradient id="pythoYellow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#FACC15"/>
    </linearGradient>
    <linearGradient id="pythoBlueGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Shadow Base -->
  <ellipse cx="80" cy="148" rx="55" ry="10" fill="#000000" opacity="0.12"/>

  <!-- Coiled Body Back -->
  <path d="M 35 130 C 25 110, 45 95, 75 105 C 105 115, 135 110, 130 135 C 125 150, 45 150, 35 130 Z" fill="url(#pythoGreen)" filter="url(#dropShadow)"/>

  <!-- Yellow Belly Segments -->
  <path d="M 50 120 C 65 115, 95 115, 110 125 C 105 138, 55 138, 50 120 Z" fill="url(#pythoYellow)"/>

  <!-- Head Base -->
  <ellipse cx="80" cy="65" rx="42" ry="36" fill="url(#pythoGreen)" filter="url(#dropShadow)"/>

  <!-- Cheeks -->
  <ellipse cx="50" cy="74" rx="7" ry="5" fill="#F87171" opacity="0.5"/>
  <ellipse cx="110" cy="74" rx="7" ry="5" fill="#F87171" opacity="0.5"/>

  <!-- Big Cartoon Eyes -->
  <circle cx="62" cy="55" r="15" fill="#FFFFFF"/>
  <circle cx="98" cy="55" r="15" fill="#FFFFFF"/>
  <circle cx="65" cy="55" r="9" fill="url(#pythoBlueGlow)"/>
  <circle cx="95" cy="55" r="9" fill="url(#pythoBlueGlow)"/>
  <circle cx="68" cy="52" r="3.5" fill="#FFFFFF"/>
  <circle cx="98" cy="52" r="3.5" fill="#FFFFFF"/>

  <!-- Cute Smile & Tongue -->
  <path d="M 68 76 Q 80 86 92 76" stroke="#14532D" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M 80 82 Q 80 94 85 97 M 80 90 L 76 96" stroke="#EF4444" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Developer Glasses / Headset Detail -->
  <rect x="74" y="22" width="12" height="10" rx="3" fill="#F59E0B"/>
  <text x="80" y="30" font-family="'JetBrains Mono', monospace" font-size="7" font-weight="bold" fill="#FFFFFF" text-anchor="middle">&lt;&gt;</text>
</svg>
