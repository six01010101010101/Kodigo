<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="cyberGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="60%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="jacketDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#10B981" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="80" cy="148" rx="50" ry="8" fill="#000000" opacity="0.18"/>

  <!-- Body Silhouette - Sleek Coiled Posture -->
  <path d="M 38 128 C 24 104, 52 90, 80 102 C 108 114, 138 104, 132 130 C 126 148, 48 148, 38 128 Z" fill="url(#jacketDark)"/>
  <path d="M 44 125 C 55 110, 80 110, 105 118 C 98 132, 52 134, 44 125 Z" fill="url(#cyberGreen)"/>

  <!-- Head Base - Sleek Aerodynamic Silhouette -->
  <ellipse cx="80" cy="62" rx="40" ry="34" fill="url(#cyberGreen)" filter="url(#glow)"/>

  <!-- Developer Headset / Halo Ring -->
  <path d="M 40 55 C 38 28, 122 28, 120 55" stroke="url(#jacketDark)" stroke-width="7" fill="none" stroke-linecap="round"/>
  <circle cx="39" cy="56" r="9" fill="url(#neonCyan)"/>
  <circle cx="121" cy="56" r="9" fill="url(#neonCyan)"/>
  <path d="M 39 56 L 48 70" stroke="url(#jacketDark)" stroke-width="3" stroke-linecap="round"/>
  <circle cx="49" cy="71" r="3" fill="#10B981"/>

  <!-- Sophisticated Expressive Eyes -->
  <ellipse cx="64" cy="58" rx="10" ry="12" fill="#0F172A"/>
  <ellipse cx="96" cy="58" rx="10" ry="12" fill="#0F172A"/>
  <!-- Iris Glow -->
  <circle cx="66" cy="56" r="6" fill="url(#neonCyan)"/>
  <circle cx="94" cy="56" r="6" fill="url(#neonCyan)"/>
  <!-- Catchlight Highlights -->
  <circle cx="68" cy="54" r="2.5" fill="#FFFFFF"/>
  <circle cx="96" cy="54" r="2.5" fill="#FFFFFF"/>

  <!-- Sleek Confident Smile -->
  <path d="M 72 74 Q 80 80 88 74" stroke="#064E3B" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Tech Core Pendant (Python Dual Symbol) -->
  <rect x="74" y="98" width="12" height="12" rx="4" fill="url(#neonCyan)"/>
  <circle cx="80" cy="104" r="2.5" fill="#0F172A"/>
</svg>
