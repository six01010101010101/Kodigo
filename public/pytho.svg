<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <defs>
    <!-- Serpent Emerald Scales Gradient -->
    <linearGradient id="cobraScale" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="45%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>
    <!-- Ventral Belly Scales Gradient -->
    <linearGradient id="bellyScales" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
    <!-- Cyber Neon Glow -->
    <linearGradient id="cyberNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <!-- Dark Tech Carbon -->
    <linearGradient id="techCarbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="shadowFilter" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#064E3B" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Ground Contact Shadow -->
  <ellipse cx="90" cy="164" rx="58" ry="8" fill="#000000" opacity="0.2"/>

  <!-- Lower Body Coils (Authentic Serpent S-Spiral) -->
  <path d="M 32 142 C 22 118, 56 108, 90 120 C 124 132, 158 122, 150 148 C 142 168, 42 168, 32 142 Z" fill="url(#cobraScale)" filter="url(#shadowFilter)"/>
  
  <!-- Ventral Belly Rib Plates (Segmented Serpent Scales) -->
  <path d="M 46 138 C 62 126, 95 126, 122 136 C 114 154, 54 154, 46 138 Z" fill="url(#bellyScales)"/>
  <line x1="65" y1="131" x2="62" y2="148" stroke="#CA8A04" stroke-width="2"/>
  <line x1="84" y1="129" x2="84" y2="149" stroke="#CA8A04" stroke-width="2"/>
  <line x1="104" y1="132" x2="106" y2="147" stroke="#CA8A04" stroke-width="2"/>

  <!-- Iconic Cobra Flared Hood (Capelo da Naja) -->
  <path d="M 90 32 C 40 45, 30 92, 68 112 C 80 118, 100 118, 112 112 C 150 92, 140 45, 90 32 Z" fill="url(#cobraScale)" filter="url(#shadowFilter)"/>
  
  <!-- Cyber Circuit Traces on Cobra Hood (Programming Motifs: { & } and < / >) -->
  <path d="M 48 70 Q 56 82 50 94" stroke="url(#cyberNeon)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <text x="51" y="86" fill="#67E8F9" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">&lt;</text>
  
  <path d="M 132 70 Q 124 82 130 94" stroke="url(#cyberNeon)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <text x="123" y="86" fill="#67E8F9" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">&gt;</text>

  <!-- Snake Throat Plate -->
  <path d="M 78 88 C 76 104, 104 104, 102 88 C 100 80, 80 80, 78 88 Z" fill="url(#bellyScales)"/>

  <!-- Sleek Cobra Head (Serpentine Taper) -->
  <path d="M 90 28 C 70 30, 62 48, 68 68 C 74 84, 106 84, 112 68 C 118 48, 110 30, 90 28 Z" fill="url(#cobraScale)"/>

  <!-- Authentic Serpent Eyes with Vertical Slit Pupil + Cyber Reflex -->
  <!-- Left Eye -->
  <ellipse cx="76" cy="54" rx="8.5" ry="10" fill="#0F172A"/>
  <ellipse cx="76" cy="54" rx="7" ry="8.5" fill="#FEF08A"/>
  <path d="M 76 46 Q 78 54 76 62 Q 74 54 76 46" fill="#0F172A"/>
  <circle cx="78" cy="51" r="2" fill="#FFFFFF"/>

  <!-- Right Eye -->
  <ellipse cx="104" cy="54" rx="8.5" ry="10" fill="#0F172A"/>
  <ellipse cx="104" cy="54" rx="7" ry="8.5" fill="#FEF08A"/>
  <path d="M 104 46 Q 106 54 104 62 Q 102 54 104 46" fill="#0F172A"/>
  <circle cx="106" cy="51" r="2" fill="#FFFFFF"/>

  <!-- Serpentine Snout Nostrils & Mouth -->
  <circle cx="86" cy="40" r="1.5" fill="#064E3B"/>
  <circle cx="94" cy="40" r="1.5" fill="#064E3B"/>
  <path d="M 80 66 Q 90 73 100 66" stroke="#064E3B" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Bifurcated Snake Tongue (Língua Bífida) -->
  <path d="M 90 71 L 90 84 M 90 84 L 84 92 M 90 84 L 96 92" stroke="#EF4444" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Tech Cyber Collar with Python Blue/Yellow Hexagon Core -->
  <rect x="79" y="102" width="22" height="14" rx="4" fill="url(#techCarbon)"/>
  <text x="90" y="112" fill="#06B6D4" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="900" text-anchor="middle">&lt;/&gt;</text>
</svg>
